<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The brand mark, and the same two files the header tile uses.

      Two links with a `media` query rather than one: the artwork is a cut, not a
      shape with a transparent ground, so the mint-on-black version disappears
      into a light browser chrome and the black-on-mint one into a dark. Chromium
      and Safari pick per scheme; anything that ignores `media` takes the last
      one it understood, which is why the dark cut is declared unconditionally
      first — it is the safer of the two against an unknown tab strip.
    -->
    <link rel="icon" type="image/jpeg" href="/logo/logo-dark.jpg" />
    <link
      rel="icon"
      type="image/png"
      href="/logo/logo-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link rel="apple-touch-icon" href="/logo/logo-dark.jpg" />
    <!--
      `viewport-fit=cover` is not decoration: every `env(safe-area-inset-*)` in
      `site.css` (the partner dashboard's bottom bar, the assistant button, the
      nav sheet) resolves to 0 without it, so the whole safe-area effort is inert
      on an iPhone until this attribute is present. There is deliberately no
      `maximum-scale` or `user-scalable=no` — pinch-zoom is the last resort for
      anything this stylesheet gets wrong, and taking it away is not ours to do.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Paylez — Play &amp; Earn</title>
    <!--
      The canonical URL, and the one thing worth knowing about it: **this site
      is hash-routed**, so every page of it is a fragment of this one document.
      A crawler strips the fragment before fetching, which means there is
      exactly one canonical URL to state and stating it here is correct rather
      than lazy — `#/business` and `#/vouchers` really are the same resource as
      far as anything outside the browser is concerned.

      The day the routes become real paths (see `scripts/build-sitemap.ts` for
      what that would take and why the sitemap cannot substitute for it), this
      tag has to become per-page or it starts telling Google that nine pages are
      one. It is a single line today because today there is a single page.

      Kept absolute and hard-coded rather than built from `location`: a
      canonical resolved by the page it appears on can only ever agree with
      itself, which is the one thing it is not for.
    -->
    <link rel="canonical" href="https://new.pay-lez.com/" />
    <!--
      What a search result says under the title. Written here rather than in
      `i18n/` for the reason the title is: this is the document's own metadata,
      read before any JavaScript runs and therefore before a language has been
      chosen. English because that is the fallback every dictionary falls back
      to.
    -->
    <meta
      name="description"
      content="Paylez turns everyday spending into points. Play quick games to earn, spend at cafés, salons and shops near you, and find your way around a new country."
    />
    <!--
      Resolve the theme before the first paint. React sets the same attribute
      from ThemeProvider, but it only runs after the document has already been
      painted once — without this, a light-theme visitor sees a black flash.
      Keep the storage key in sync with `site/theme/ThemeProvider.tsx`.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('paylez-theme');
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        } catch (e) {
          /*
            Storage threw — blocked site data, a sandboxed iframe, an enterprise
            policy. That says nothing about which theme the visitor wants, so
            fall back to the *system* preference rather than to dark, which is
            what `ThemeProvider` does on the same failure (`stored()` returns
            null and the initialiser falls through to `systemTheme()`).
            Hardcoding 'dark' here made the two disagree in exactly the case
            this script exists for: a light-preferring visitor got the black
            flash, then React corrected it.
          */
          try {
            document.documentElement.dataset.theme = window.matchMedia(
              '(prefers-color-scheme: light)',
            ).matches
              ? 'light'
              : 'dark';
          } catch (e2) {
            document.documentElement.dataset.theme = 'dark';
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

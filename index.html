<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paylez — Play &amp; Earn</title>
    <!--
      Resolve the theme before the first paint. React sets the same attribute
      from ThemeProvider, but it only runs after the document has already been
      painted once — without this, a light-theme visitor sees a black flash.
      Keep the storage key in sync with `site/theme/ThemeProvider.tsx`.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('paylez-theme');
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
